name: CI
on:
  push:
    branches: [master]
  pull_request:
env:
  NO_COLOR: '1'
  FORCE_COLOR: '0'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage -- --coverageReporters=text-summary 2>&1 | tee jest.log
        shell: bash
      - run: npm run test -w @silveracademy/web 2>&1 | tee web.log
        shell: bash
      - name: Summary
        if: always()
        run: |
          { echo '### Unit tests and coverage'; echo '```'
            grep -hE '^(Tests|Test Suites):|^ *(Test Files|Tests) |^(Statements|Branches|Functions|Lines) +:' jest.log web.log || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build:functions
      - run: printf 'AUTH_MODE=mock\nQR_HMAC_SECRET=dev-only-change-me\nDEMO_IGNORE_CHECKIN_WINDOW=true\nMAP_PROVIDER=stub\n' > functions/.env.local
      - run: npm run test:emulator 2>&1 | tee emulator.log
        shell: bash
      - run: npx firebase emulators:exec --config firebase/firebase.json --project demo-silveracademy "npm run seed && npm run e2e" 2>&1 | tee e2e.log
        shell: bash
      - name: Summary
        if: always()
        run: |
          { echo '### Emulator tests and e2e'; echo '```'
            grep -hE '^(Tests|Test Suites):|checks passed' emulator.log e2e.log || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
